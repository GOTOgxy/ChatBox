<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="titlebar.css" />
</head>
<body>
  <div id="bar" class="bar">
    <div class="nav-group">
      <button id="nav-home" class="nav-btn" title="回到站点首页">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      </button>
      <button id="nav-back" class="nav-btn" title="后退">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button id="nav-forward" class="nav-btn" title="前进">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="url-wrap">
      <input id="url-input" class="url-input" spellcheck="false" placeholder="输入地址,Enter 前往" />
    </div>
    <button id="nav-reload" class="nav-btn" title="刷新">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v6h-6"/></svg>
    </button>
    <div id="win-right" class="win-controls">
      <button id="win-min-r" class="win-btn" title="最小化">
        <svg viewBox="0 0 12 12" width="11" height="11"><rect x="1" y="5.5" width="10" height="1.2" fill="currentColor"/></svg>
      </button>
      <button id="win-max-r" class="win-btn" title="最大化/还原">
        <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.1"><rect x="1.5" y="1.5" width="9" height="9" rx="1.5"/></svg>
      </button>
      <button id="win-close-r" class="win-btn close" title="隐藏到托盘">
        <svg viewBox="0 0 12 12" width="11" height="11" stroke="currentColor" stroke-width="1.3"><path d="M2 2l8 8M10 2l-8 8"/></svg>
      </button>
    </div>
  </div>
  <script src="../common/theme.js"></script>
  <script src="titlebar.js"></script>
</body>
</html>
