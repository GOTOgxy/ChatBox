name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: win
          - os: macos-latest
            kind: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        if: matrix.kind == 'win'
        shell: pwsh
        run: |
          npm run dist:win
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = node -p "require('./package.json').version"
          & $iscc /DMyAppVersion=$version installer\chatbox.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build macOS DMG (arm64)
        if: matrix.kind == 'mac'
        run: npm run dist:mac

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.kind }}
          path: |
            release/ChatBox-Setup-*.exe
            release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble release directory
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -la release/
          node scripts/make-checksums.js

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match package.json version v$version"
              exit 1
            fi
          else
            tag="v$version"
          fi
          assets=(release/*.exe release/*.dmg release/checksums.txt)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            echo "release $tag updated (CI build)"
          else
            gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "ChatBox $version" --target "$GITHUB_SHA" \
              --notes "ChatBox $version

          由 GitHub Actions 自动构建发布(Windows exe + macOS arm64 dmg + checksums)。

          【mac 安装必读】浏览器下载的 DMG 带隔离标记,首次打开报「已损坏」时执行:
          xattr -dr com.apple.quarantine /Applications/ChatBox.app"
            echo "release $tag published (CI build)"
          fi
